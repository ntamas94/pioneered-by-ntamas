--[[ System overlay for the Pi DJ box.

Sits on top of the fullscreen Mixxx window and shows the numbers that decide
whether the box will hold up: DSP-relevant CPU load, core temperature, the
actual ARM clock, and the throttle flags.

The throttle line is the important one. This Pi has repeatedly dropped to
600 MHz from under-voltage caused by the touchscreen drawing its power from
the Pi's USB, and at 38 degrees that is invisible unless you look for it.
Bits: 0x1 under-voltage now, 0x4 throttled now, 0x10000/0x40000 latched since
boot. Latched bits only clear on reboot.

Launch:  conky -c ~/.config/conky/djbox.conf -d
]]

conky.config = {
    -- override type puts the window above the fullscreen app without the
    -- window manager reparenting or hiding it.
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_class = 'ConkyDJBox',

    alignment = 'top_right',
    gap_x = 8,
    gap_y = 4,
    minimum_width = 190,

    background = true,
    double_buffer = true,
    update_interval = 2.0,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=8',
    override_utf8_locale = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_inner_margin = 5,

    default_color = 'a0a0a0',
    color1 = 'ffffff',  -- values
    color2 = '4fc3f7',  -- labels
    color3 = 'ff5252',  -- alarm

    cpu_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
}

conky.text = [[
${color2}CPU ${color1}${cpu cpu0}%${color2}  ${goto 78}C1 ${color1}${cpu cpu1}%${color2} C2 ${color1}${cpu cpu2}%${color2} C3 ${color1}${cpu cpu3}%${color2} C4 ${color1}${cpu cpu4}%
${color2}TEMP ${color1}${execi 4 vcgencmd measure_temp | cut -d= -f2}${color2}  CLK ${color1}${execi 4 awk '{printf "%d MHz", $1/1000}' /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq}
${color2}RAM ${color1}${memperc}%${color2}  GOV ${color1}${execi 30 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}
${color2}PWR ${color1}${execi 4 /home/dj/djbox-power-status.sh}
]]
